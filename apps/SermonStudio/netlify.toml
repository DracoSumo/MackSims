[build]
  command = "npm run build"
  # Next.js Runtime (@netlify/plugin-nextjs) owns publish output.
  # Do NOT set publish = ".next" - CLI manual deploys of .next return site-wide 404.
  # Also clear Netlify UI "Publish directory" if it is stuck on .next (publishOrigin=ui).

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NODE_VERSION = "20"
  SECRETS_SCAN_OMIT_KEYS = "NEXT_PUBLIC_SUPABASE_ANON_KEY"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"