[build]
  # Only allowlisted web files are published (scripts/prepare-dist.mjs), so
  # migrations, tests, scripts and docs are never publicly reachable.
  command = "node scripts/prepare-dist.mjs"
  publish = "dist"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=63072000; includeSubDomains"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(self), payment=(), usb=(), browsing-topics=()"
    Cross-Origin-Opener-Policy = "same-origin"
    # supabase-js is self-hosted and pinned (vendor/), so scripts come only from this origin.
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; media-src 'self' data: blob: https:; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://api.open-meteo.com https://marine-api.open-meteo.com https://api.tidesandcurrents.noaa.gov https://api.bigdatacloud.net https://graph.facebook.com; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"

# Clean URLs (also mirrored in _redirects).
[[redirects]]
  from = "/guest"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/captain"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/early-access"
  to = "/early-access.html"
  status = 200

[[redirects]]
  from = "/captains"
  to = "/early-access.html"
  status = 200

[[redirects]]
  from = "/charters"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/support"
  to = "/support.html"
  status = 200

[[redirects]]
  from = "/privacy"
  to = "/privacy.html"
  status = 200

[[redirects]]
  from = "/terms"
  to = "/terms.html"
