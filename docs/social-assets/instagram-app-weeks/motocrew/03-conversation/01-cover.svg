         <text x="72" y="250" fill="#f6f1fb" font-family="Segoe UI, Arial, sans-serif" font-size="56" font-weight="800">We’d love your</text><text x="72" y="313" fill="#f6f1fb" font-family="Segoe UI, Arial, sans-serif" font-size="56" font-weight="800">honest notes.</text>
